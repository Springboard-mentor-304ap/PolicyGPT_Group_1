services:
  postgres:
    image: postgres:18.6
    container_name: policygpt_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: policygpt_db
      POSTGRES_USER: policygpt_user
      POSTGRES_PASSWORD: policygpt_password

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ../database/sample_data.sql:/docker-entrypoint-initdb.d/02-sample-data.sql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U policygpt_user -d policygpt_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
    name: policygpt_postgres18_data
