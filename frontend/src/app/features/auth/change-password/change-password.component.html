<div class="change-password-page">

  <!-- =====================================================
       PAGE HEADER
       ===================================================== -->

  <div class="page-header">

    <div>

      <h1>
        Change Password
      </h1>

      <p>
        Update your account password
      </p>

    </div>

  </div>


  <!-- =====================================================
       PASSWORD CARD
       ===================================================== -->

  <div class="password-card">

    <!-- ===================================================
         ICON
         =================================================== -->

    <div class="password-icon">

      <i class="fa-solid fa-lock"></i>

    </div>


    <!-- ===================================================
         TITLE
         =================================================== -->

    <h2>
      Change your password
    </h2>


    <p class="description">
      Enter your current password and choose a new password.
    </p>


    <!-- ===================================================
         ERROR MESSAGE
         =================================================== -->

    <div class="message error-message" *ngIf="errorMessage">

      <i class="fa-solid fa-circle-exclamation"></i>

      <span>
        {{ errorMessage }}
      </span>

    </div>


    <!-- ===================================================
         SUCCESS MESSAGE
         =================================================== -->

    <div class="message success-message" *ngIf="successMessage">

      <i class="fa-solid fa-circle-check"></i>

      <span>
        {{ successMessage }}
      </span>

    </div>


    <!-- ===================================================
         FORM
         =================================================== -->

    <form (ngSubmit)="onChangePassword()" #passwordForm="ngForm" novalidate>

      <!-- ===============================================
           CURRENT PASSWORD
           =============================================== -->

      <div class="form-group">

        <label for="currentPassword">
          Current Password
        </label>


        <div class="password-input">

          <i class="fa-solid fa-lock input-icon"></i>


          <input id="currentPassword" name="currentPassword" [type]="
              showCurrentPassword
                ? 'text'
                : 'password'
            " [(ngModel)]="currentPassword" placeholder="Enter current password" autocomplete="current-password"
            [disabled]="changingPassword" required />


          <button type="button" class="eye-button" (click)="toggleCurrentPassword()" [disabled]="changingPassword"
            aria-label="Show or hide current password">

            <i class="fa-solid" [ngClass]="
                showCurrentPassword
                  ? 'fa-eye-slash'
                  : 'fa-eye'
              "></i>

          </button>

        </div>

      </div>


      <!-- ===============================================
           NEW PASSWORD
           =============================================== -->

      <div class="form-group">

        <label for="newPassword">
          New Password
        </label>


        <div class="password-input">

          <i class="fa-solid fa-lock input-icon"></i>


          <input id="newPassword" name="newPassword" [type]="
              showNewPassword
                ? 'text'
                : 'password'
            " [(ngModel)]="newPassword" placeholder="Enter new password" autocomplete="new-password"
            [disabled]="changingPassword" minlength="8" maxlength="72" required />


          <button type="button" class="eye-button" (click)="toggleNewPassword()" [disabled]="changingPassword"
            aria-label="Show or hide new password">

            <i class="fa-solid" [ngClass]="
                showNewPassword
                  ? 'fa-eye-slash'
                  : 'fa-eye'
              "></i>

          </button>

        </div>


        <small class="password-help">
          Password must contain at least 8 characters.
        </small>

      </div>


      <!-- ===============================================
           CONFIRM PASSWORD
           =============================================== -->

      <div class="form-group">

        <label for="confirmPassword">
          Confirm New Password
        </label>


        <div class="password-input">

          <i class="fa-solid fa-lock input-icon"></i>


          <input id="confirmPassword" name="confirmPassword" [type]="
              showConfirmPassword
                ? 'text'
                : 'password'
            " [(ngModel)]="confirmPassword" placeholder="Confirm new password" autocomplete="new-password"
            [disabled]="changingPassword" minlength="8" maxlength="72" required />


          <button type="button" class="eye-button" (click)="toggleConfirmPassword()" [disabled]="changingPassword"
            aria-label="Show or hide confirm password">

            <i class="fa-solid" [ngClass]="
                showConfirmPassword
                  ? 'fa-eye-slash'
                  : 'fa-eye'
              "></i>

          </button>

        </div>

      </div>


      <!-- =================================================
           BUTTONS
           ================================================= -->

      <div class="form-actions">


        <!-- =============================================
             BACK
             ============================================= -->

        <button type="button" class="back-button" (click)="goBack()" [disabled]="changingPassword">

          <i class="fa-solid fa-arrow-left"></i>

          <span>
            Back
          </span>

        </button>


        <!-- =============================================
             CHANGE PASSWORD
             ============================================= -->

        <button type="submit" class="change-button" [disabled]="changingPassword">

          <i class="fa-solid" [ngClass]="
              changingPassword
                ? 'fa-spinner fa-spin'
                : 'fa-rotate'
            "></i>


          <span>
            {{
            changingPassword
            ? "Changing..."
            : "Change Password"
            }}
          </span>

        </button>

      </div>

    </form>

  </div>

</div>
