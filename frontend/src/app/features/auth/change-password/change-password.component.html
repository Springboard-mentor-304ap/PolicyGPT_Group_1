<div class="change-password-page">

  <!-- =====================================================
       PASSWORD CARD
       ===================================================== -->

  <div class="password-card">

    <!-- ===================================================
         ICON
         =================================================== -->

    <div class="password-icon">
      <span class="material-icons">lock</span>
    </div>


    <!-- ===================================================
         TITLE
         =================================================== -->

    <h2>
      Change your password
    </h2>

    <p class="description">
      Enter your current password and choose a new password.
    </p>


    <!-- ===================================================
         ERROR MESSAGE
         =================================================== -->

    <div class="message error-message" *ngIf="errorMessage">
      <span class="material-icons">
        error
      </span>

      <span>
        {{ errorMessage }}
      </span>
    </div>


    <!-- ===================================================
         SUCCESS MESSAGE
         =================================================== -->

    <div class="message success-message" *ngIf="successMessage">
      <span class="material-icons">
        check_circle
      </span>

      <span>
        {{ successMessage }}
      </span>
    </div>


    <!-- ===================================================
         FORM
         =================================================== -->

    <form #passwordForm="ngForm" (ngSubmit)="onChangePassword()" novalidate>

      <!-- ===============================================
           CURRENT PASSWORD
           =============================================== -->

      <div class="form-group">

        <label for="currentPassword">
          Current Password
        </label>

        <div class="password-input">

          <span class="material-icons input-icon">
            lock
          </span>

          <input id="currentPassword" name="currentPassword" [type]="showCurrentPassword ? 'text' : 'password'"
            [(ngModel)]="currentPassword" placeholder="Enter current password" autocomplete="current-password"
            [disabled]="changingPassword" required />

          <button type="button" class="eye-button" (click)="toggleCurrentPassword()" [disabled]="changingPassword"
            aria-label="Show or hide current password">
            <span class="material-icons">
              {{ showCurrentPassword ? 'visibility_off' : 'visibility' }}
            </span>
          </button>

        </div>

      </div>


      <!-- ===============================================
           NEW PASSWORD
           =============================================== -->

      <div class="form-group">

        <label for="newPassword">
          New Password
        </label>

        <div class="password-input">

          <span class="material-icons input-icon">
            lock
          </span>

          <input id="newPassword" name="newPassword" [type]="showNewPassword ? 'text' : 'password'"
            [(ngModel)]="newPassword" placeholder="Enter new password" autocomplete="new-password"
            [disabled]="changingPassword" minlength="8" maxlength="72" required />

          <button type="button" class="eye-button" (click)="toggleNewPassword()" [disabled]="changingPassword"
            aria-label="Show or hide new password">
            <span class="material-icons">
              {{ showNewPassword ? 'visibility_off' : 'visibility' }}
            </span>
          </button>

        </div>

        <small class="password-help">
          Password must contain at least 8 characters.
        </small>

      </div>


      <!-- ===============================================
           CONFIRM PASSWORD
           =============================================== -->

      <div class="form-group">

        <label for="confirmPassword">
          Confirm New Password
        </label>

        <div class="password-input">

          <span class="material-icons input-icon">
            lock
          </span>

          <input id="confirmPassword" name="confirmPassword" [type]="showConfirmPassword ? 'text' : 'password'"
            [(ngModel)]="confirmPassword" placeholder="Confirm new password" autocomplete="new-password"
            [disabled]="changingPassword" minlength="8" maxlength="72" required />

          <button type="button" class="eye-button" (click)="toggleConfirmPassword()" [disabled]="changingPassword"
            aria-label="Show or hide confirm password">
            <span class="material-icons">
              {{ showConfirmPassword ? 'visibility_off' : 'visibility' }}
            </span>
          </button>

        </div>

      </div>


      <!-- =================================================
           BUTTONS
           ================================================= -->

      <div class="form-actions">

        <!-- =============================================
             BACK
             ============================================= -->

        <button type="button" class="back-button" (click)="goBack()" [disabled]="changingPassword">
          <span class="material-icons">
            arrow_back
          </span>

          <span>
            Back
          </span>
        </button>


        <!-- =============================================
             CHANGE PASSWORD
             ============================================= -->

        <button type="submit" class="change-button" [disabled]="changingPassword">

          <span class="material-icons">
            {{ changingPassword ? 'refresh' : 'lock_reset' }}
          </span>

          <span>
            {{
            changingPassword
            ? 'Changing...'
            : 'Change Password'
            }}
          </span>

        </button>

      </div>

    </form>

  </div>

</div>
