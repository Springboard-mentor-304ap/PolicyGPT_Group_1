<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

<div class="change-password-card">
  <h2>Change Password</h2>

  <form [formGroup]="passwordForm" (ngSubmit)="onSubmit()">
    <!-- Current Password Field -->
    <div class="form-group">
      <label for="currentPassword">Current password</label>
      <div class="input-wrapper">
        <span class="material-symbols-outlined input-icon">lock</span>
        <input
          [type]="showCurrentPassword ? 'text' : 'password'"
          id="currentPassword"
          formControlName="currentPassword"
          placeholder="Enter your current password"
        />
        <span
          class="material-symbols-outlined toggle-icon"
          (click)="toggleVisibility('current')"
        >
          {{ showCurrentPassword ? 'visibility_off' : 'visibility' }}
        </span>
      </div>
    </div>

    <!-- New Password Field -->
    <div class="form-group">
      <label for="newPassword">New password</label>
      <div class="input-wrapper">
        <span class="material-symbols-outlined input-icon">lock</span>
        <input
          [type]="showNewPassword ? 'text' : 'password'"
          id="newPassword"
          formControlName="newPassword"
          placeholder="Enter your new password"
        />
        <span
          class="material-symbols-outlined toggle-icon"
          (click)="toggleVisibility('new')"
        >
          {{ showNewPassword ? 'visibility_off' : 'visibility' }}
        </span>
      </div>
    </div>

    <!-- Confirm New Password Field -->
    <div class="form-group">
      <label for="confirmPassword">Confirm New password</label>
      <div class="input-wrapper">
        <span class="material-symbols-outlined input-icon">lock</span>
        <input
          [type]="showConfirmPassword ? 'text' : 'password'"
          id="confirmPassword"
          formControlName="confirmPassword"
          placeholder="Confirm your new password"
        />
        <span
          class="material-symbols-outlined toggle-icon"
          (click)="toggleVisibility('confirm')"
        >
          {{ showConfirmPassword ? 'visibility_off' : 'visibility' }}
        </span>
      </div>
    </div>

    <!-- Mismatch Warning Message -->
    <div
      class="error-text"
      *ngIf="passwordForm.hasError('passwordMismatch') && passwordForm.get('confirmPassword')?.touched"
    >
      New password and confirm password do not match.
    </div>

    <!-- Submit Button -->
    <div class="button-container">
      <button type="submit" [disabled]="passwordForm.invalid">
        Confirm
      </button>
    </div>
  </form>
</div>
