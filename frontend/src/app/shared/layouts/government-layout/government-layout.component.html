<div class="dash-layout" [class.dash-layout--sidebar-collapsed]="sidebarCollapsed"
    [class.dash-layout--mobile-open]="mobileMenuOpen">


    <!-- =====================================================
       MOBILE OVERLAY
       ===================================================== -->

    @if (mobileMenuOpen) {

    <button type="button" class="dash-overlay" aria-label="Close navigation menu" (click)="closeMobileMenu()"></button>

    }


    <!-- =====================================================
       TOPBAR
       ===================================================== -->

    <header class="dash-topbar">


        <!-- ===================================================
         BRAND
         =================================================== -->

        <div class="dash-topbar__brand">


            <!-- MENU BUTTON -->

            <button type="button" class="dash-topbar__toggle" aria-label="Toggle sidebar" [attr.aria-expanded]="
          !sidebarCollapsed
        " (click)="toggleSidebar()">

                <span class="material-icons">
                    menu
                </span>

            </button>


            <!-- LOGO -->

            <a routerLink="/dashboard/government" class="dash-topbar__logo-link" aria-label="PolicyGPT Dashboard">

                <img src="/images/logo.png" alt="PolicyGPT" class="dash-topbar__logo" />

            </a>


            <!-- BRAND TEXT -->

            <div class="dash-topbar__brand-text">

                <span class="dash-topbar__title">
                    Policy<span>GPT</span>
                </span>

                <span class="dash-topbar__tagline">
                    Government Policy & Public Scheme Intelligence
                </span>

            </div>

        </div>


        <!-- ===================================================
         SEARCH
         =================================================== -->

        <form class="dash-search" (submit)="performSearch(); $event.preventDefault()">

            <span class="material-icons dash-search__icon">
                search
            </span>


            <input type="text" name="search" [(ngModel)]="searchText"
                placeholder="Search policies, schemes, documents..." aria-label="Search" />


            @if (searchText) {

            <button type="button" class="dash-search__clear" aria-label="Clear search" (click)="clearSearch()">

                <span class="material-icons">
                    close
                </span>

            </button>

            }

        </form>


        <!-- ===================================================
         USER AREA
         =================================================== -->

        <div class="dash-user">


            <!-- NOTIFICATIONS -->

            <button type="button" class="dash-user__icon-btn" aria-label="Notifications" routerLink="/notifications">

                <span class="material-icons">
                    notifications_none
                </span>

            </button>


            <!-- AVATAR -->

            <div class="dash-user__avatar" aria-hidden="true">

                <span class="material-icons">
                    person
                </span>

            </div>


            <!-- USER DETAILS -->

            <div class="dash-user__info">

                <p class="dash-user__name">
                    {{ userName }}
                </p>

                <p class="dash-user__role">
                    {{ userRole }}
                </p>

            </div>

        </div>

    </header>


    <!-- =====================================================
       SIDEBAR
       ===================================================== -->

    <aside class="dash-sidebar" [class.dash-sidebar--collapsed]="sidebarCollapsed">


        <!-- ===================================================
         NAVIGATION
         =================================================== -->

        <nav class="dash-nav" aria-label="Government navigation">

            @for (
            item of navItems;
            track item.route
            ) {

            <a class="dash-nav__item" [routerLink]="item.route" routerLinkActive="dash-nav__item--active"
                [routerLinkActiveOptions]="{
            exact: item.route === '/dashboard/government'
          }" [attr.title]="
            sidebarCollapsed
              ? item.label
              : null
          " (click)="closeMobileMenu()">

                <span class="material-icons dash-nav__icon" aria-hidden="true">
                    {{ item.icon }}
                </span>

                <span class="dash-nav__label">
                    {{ item.label }}
                </span>

            </a>

            }

        </nav>


        <!-- ===================================================
         SIDEBAR FOOTER
         =================================================== -->

        <div class="dash-sidebar__footer">


            <!-- PROFILE -->

            <a routerLink="/user/profile" class="dash-nav__item" routerLinkActive="dash-nav__item--active" [attr.title]="
          sidebarCollapsed
            ? 'Profile'
            : null
        " (click)="closeMobileMenu()">

                <span class="material-icons dash-nav__icon">
                    person
                </span>

                <span class="dash-nav__label">
                    Profile
                </span>

            </a>


            <!-- SETTINGS -->

            <a routerLink="/user/settings" class="dash-nav__item" routerLinkActive="dash-nav__item--active"
                [attr.title]="
          sidebarCollapsed
            ? 'Settings'
            : null
        " (click)="closeMobileMenu()">

                <span class="material-icons dash-nav__icon">
                    settings
                </span>

                <span class="dash-nav__label">
                    Settings
                </span>

            </a>


            <!-- LOGOUT -->

            <button type="button" class="dash-nav__item dash-nav__logout" [attr.title]="
          sidebarCollapsed
            ? 'Logout'
            : null
        " (click)="logout()">

                <span class="material-icons dash-nav__icon">
                    logout
                </span>

                <span class="dash-nav__label">
                    Logout
                </span>

            </button>

        </div>

    </aside>


    <!-- =====================================================
       MAIN CONTAINER
       ===================================================== -->

    <div class="dash-main-container">


        <!-- ===================================================
         PAGE CONTENT
         =================================================== -->

        <main class="dash-main">

            <router-outlet></router-outlet>

        </main>


        <!-- ===================================================
         SHARED FOOTER
         =================================================== -->

        <app-footer></app-footer>

    </div>


    <!-- =====================================================
       LOGOUT MODAL
       ===================================================== -->

    @if (showLogoutModal) {

    <app-logout-confirm (confirmed)="confirmLogout()" (cancelled)="cancelLogout()"></app-logout-confirm>

    }

</div>
