<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="color-scheme" content="only light" />
  <title>PolicygptFrontend</title>
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    /* First-paint light guard: parsed before the app bundle loads, so the
       initial render is always the light page background with dark text —
       no dark flash, regardless of OS/browser theme or bundle load timing.
       Plain light-palette values only; no theme logic of any kind. */
    html{background:#f5f7fb;color-scheme:only light}
    body{background:#f5f7fb;color:#1e293b;margin:0}
  </style>
  <link rel="icon" type="image/png" href="images/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
</head>

<body>
  <app-root></app-root>
</body>

</html>
